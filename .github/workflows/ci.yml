name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  schedule:
    # Еженедельный глубокий фаззинг (проптесты на 10 000 итераций)
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  rust-check:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting check (phrase subsystem)
        shell: bash
        run: rustfmt --check crates/dub-asr/src/phrase/*.rs
      - name: Clippy dub-asr
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p dub-asr --all-targets --locked -- -D warnings 2>&1 | tee clippy.log || {
            cat clippy.log | grep -E "(error|warning):" | head -n 10 | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml,line=25,title=clippy::$line"
            done
            exit 1
          }
      - name: Tests & Property tests
        env:
          PROPTEST_CASES: 256
        shell: bash
        run: cargo test --workspace --locked

  generate-lockfile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Check workspace and create minimal lockfile
        run: cargo check --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  weekly-proptest:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Deep property tests (10 000 iterations)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p dub-asr --test property_tests --locked -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
