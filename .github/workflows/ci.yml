name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  schedule:
    # Еженедельный глубокий фаззинг (проптесты на 10 000 итераций)
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  rust-check:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting check & export diff
        shell: bash
        run: |
          cargo fmt --all > fmt_output.txt 2>&1 || true
          git status --short > fmt_status.txt
          git diff > fmt.diff
      - name: Upload format diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmt-diff
          path: |
            fmt_output.txt
            fmt.diff
            fmt_status.txt
      - name: Clippy linter
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings > clippy.log 2>&1 || true
      - name: Tests & Property tests
        env:
          PROPTEST_CASES: 256
        shell: bash
        run: |
          cargo test --workspace --locked > test.log 2>&1 || true
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            clippy.log
            test.log
            fmt_output.txt
            fmt_status.txt

  generate-lockfile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace and create minimal lockfile
        run: cargo check --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  weekly-proptest:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Deep property tests (10 000 iterations)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p dub-asr --test property_tests --locked -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
