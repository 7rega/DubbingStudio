name: CI

on:
  workflow_dispatch:
    inputs:
      fixtures_dir:
        description: 'Directory with input JSON files'
        required: false
        default: 'fixtures'
      input_artifact:
        description: 'Artifact name containing JSON files to evaluate (optional)'
        required: false
        default: ''
      task:
        description: 'Task: eval (default) or lockfile'
        required: false
        default: 'eval'
      extra_args:
        description: 'Additional flags for phrase_dump (e.g. --lambda 3.0)'
        required: false
        default: ''
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  schedule:
    # Еженедельный глубокий фаззинг (проптесты на 10 000 итераций)
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  rust-check:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting check (phrase subsystem)
        shell: bash
        run: rustfmt --check crates/dub-asr/src/phrase/*.rs
      - name: Clippy dub-asr
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p dub-asr --all-targets --locked -- -D warnings 2>&1 | tee clippy.log || {
            cat clippy.log | grep -E "(error|warning):" | head -n 10 | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml,line=25,title=clippy::$line"
            done
            exit 1
          }
      - name: Tests & Property tests
        env:
          PROPTEST_CASES: 256
        shell: bash
        run: cargo test --workspace --locked

  generate-lockfile:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'lockfile'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Check workspace and create minimal lockfile
        run: cargo check --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  evaluate-phrases:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.task != 'lockfile'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Download input artifact if specified
        if: ${{ github.event.inputs.input_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.input_artifact }}
          path: ${{ github.event.inputs.fixtures_dir }}
      - name: Run phrase evaluation
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path eval_results
          $dir = "${{ github.event.inputs.fixtures_dir }}"
          if (!(Test-Path $dir)) {
            Write-Host "Directory '$dir' does not exist, creating..."
            New-Item -ItemType Directory -Force -Path $dir
          }
          $files = Get-ChildItem -Path $dir -Filter "*.json" -Recurse
          if ($files.Count -eq 0) {
            Write-Host "No JSON files found in $dir."
            exit 1
          }
          foreach ($file in $files) {
            $stem = [System.IO.Path]::GetFileNameWithoutExtension($file.FullName)
            $outPath = Join-Path "eval_results" "$($stem)_eval.txt"
            Write-Host "=== Evaluating $($file.FullName) -> $outPath ==="
            $extra = "${{ github.event.inputs.extra_args }}"
            if ($extra -ne "") {
              cargo run -p dub-asr --example phrase_dump -- --input "$($file.FullName)" $extra.Split(' ') | Tee-Object -FilePath $outPath
            } else {
              cargo run -p dub-asr --example phrase_dump -- --input "$($file.FullName)" | Tee-Object -FilePath $outPath
            }
          }
      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: phrase-eval-results
          path: eval_results/

  weekly-proptest:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: Deep property tests (10 000 iterations)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p dub-asr --test property_tests --locked -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
