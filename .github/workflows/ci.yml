name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  schedule:
    # Еженедельный глубокий фаззинг (проптесты на 10 000 итераций)
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  rust-check:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting check & diagnostic
        shell: bash
        run: |
          cargo fmt --all 2>&1 | while IFS= read -r line; do echo "::warning title=rustfmt::$line"; done || true
          git status --short 2>&1 | while IFS= read -r line; do echo "::notice title=git-status::$line"; done
          git diff --stat 2>&1 | while IFS= read -r line; do echo "::notice title=git-diff::$line"; done
      - name: Clippy linter
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | while IFS= read -r line; do echo "::warning title=clippy::$line"; done || true
      - name: Tests & Property tests
        env:
          PROPTEST_CASES: 256
        shell: bash
        run: |
          cargo test --workspace --locked 2>&1 | while IFS= read -r line; do echo "::notice title=test::$line"; done || true

  generate-lockfile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace and create minimal lockfile
        run: cargo check --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  weekly-proptest:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Deep property tests (10 000 iterations)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p dub-asr --test property_tests --locked -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
