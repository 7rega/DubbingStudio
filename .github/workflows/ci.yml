name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, Dev, 'feat/**']
  pull_request:
  schedule:
    # Еженедельный глубокий фаззинг (проптесты на 10 000 итераций)
    - cron: '0 2 * * 0'

permissions:
  contents: write

jobs:
  rust-check:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting check & auto-fix
        shell: bash
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            echo "### Rustfmt detected unformatted files:" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "style: auto-format Rust code"
            git push || echo "Auto-format push skipped"
          else
            echo "All Rust code is cleanly formatted." >> $GITHUB_STEP_SUMMARY
          fi
      - name: Clippy linter
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee clippy.log || {
            echo "### Clippy Warnings / Errors:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat clippy.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
      - name: Tests & Property tests
        env:
          PROPTEST_CASES: 256
        shell: bash
        run: |
          cargo test --workspace --locked 2>&1 | tee test.log || {
            echo "### Test Failures:" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat test.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  generate-lockfile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Check workspace and create minimal lockfile
        run: cargo check --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: Cargo.lock
          path: Cargo.lock

  weekly-proptest:
    if: github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Deep property tests (10 000 iterations)
        env:
          PROPTEST_CASES: 10000
        run: cargo test -p dub-asr --test property_tests --locked -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
